<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snypse Gallery</title>
<style>
*{box-sizing:border-box}html{background:#f4f2ed}body{margin:0;background:#f4f2ed;color:#101010;font-family:Arial,Helvetica,sans-serif}main{max-width:1440px;margin:auto;padding:24px 36px 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 24px;border-bottom:1px solid #d8d4cc}.brand{font-weight:900;font-size:31px;letter-spacing:-1.8px}.brand b{color:#ff4b2b}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#777}
.hero{padding:74px 0 54px;display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:end}.hero h1{font-size:clamp(52px,7vw,96px);line-height:.91;margin:0;letter-spacing:-5px;font-weight:800;max-width:850px}.hero p{color:#5e5c57;font-size:18px;line-height:1.55;max-width:480px;margin:0 0 8px}
.filters{display:flex;gap:9px;overflow:auto;padding:0 0 30px}.filters button{white-space:nowrap;border:1px solid #c9c5bd;background:transparent;color:#242424;border-radius:99px;padding:11px 18px;font-size:13px;cursor:pointer}.filters button.active{background:#ff4b2b;border-color:#ff4b2b;color:white}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{min-width:0;border:1px solid #d8d4cc;border-radius:24px;overflow:hidden;background:#ebe8e1}.phone-stage{padding:18px 12px 20px;display:flex;justify-content:center;background:#e4e0d8}.phone{width:min(100%,270px);aspect-ratio:9/19.5;background:#050505;border:2px solid #292929;border-radius:38px;padding:7px;position:relative;overflow:hidden;box-shadow:0 14px 34px #0002,inset 0 0 0 1px #111}.phone-screen{height:100%;border-radius:30px;overflow:hidden;background:#161616;display:flex;flex-direction:column}.phone-status{height:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-size:9px;font-weight:700;color:#eee;background:#111}.island{width:64px;height:17px;border-radius:20px;background:#000;position:absolute;top:11px;left:50%;transform:translateX(-50%);z-index:2}.community-head{height:52px;flex:0 0 52px;border-top:1px solid #222;border-bottom:1px solid #292929;display:flex;align-items:center;gap:10px;padding:0 13px;background:#171717}.community-avatar{width:32px;height:32px;border-radius:50%;background:#ff4b2b;display:grid;place-items:center;color:white;font-size:11px;font-weight:900}.community-name{font-size:13px;font-weight:800;color:white}.community-sub{font-size:9px;color:#888;margin-top:2px}.phone-feed{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:#0e0e0e;scrollbar-width:thin}.phone-feed img,.phone-feed video{display:block;width:100%;height:auto;object-fit:contain;background:#0e0e0e}.scroll-hint{position:absolute;right:12px;bottom:16px;background:#000b;border:1px solid #444;color:#ddd;border-radius:99px;padding:5px 8px;font-size:8px;pointer-events:none}
.meta{padding:18px 19px 20px}.cat{color:#ff4b2b;text-transform:uppercase;font-weight:800;font-size:10px;letter-spacing:1.8px}.title{font-weight:800;font-size:18px;margin:9px 0 5px;letter-spacing:-.4px}.sub{color:#77736d;font-size:12px}
.modal{display:none;position:fixed;inset:0;background:#000e;z-index:10;align-items:center;justify-content:center;padding:25px}.modal.open{display:flex}.modal img,.modal video{max-height:90vh;max-width:90vw;border-radius:14px}.close{position:absolute;right:25px;top:20px;font-size:36px;cursor:pointer;color:white}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr;gap:24px}}@media(max-width:700px){main{padding:20px 18px 60px}.hero{padding:50px 0 36px}.hero h1{letter-spacing:-3px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.phone-stage{padding:10px 5px 14px}.phone{width:min(100%,210px);border-radius:31px}.phone-screen{border-radius:24px}.meta{padding:13px}.title{font-size:15px}.eyebrow{display:none}}
</style>
</head>
<body><main>
<div class="topbar"><div class="brand">snypse<b>.</b></div><div class="eyebrow">Next-Gen Media Hub · Creative Gallery</div></div>
<section class="hero"><h1>Creative work.<br>Real attention.</h1><p>A curated showcase of branded experiences delivered inside high-trust communities. Explore MagFi activations by industry.</p></section>
<div class="filters" id="filters"></div><div class="grid" id="grid"></div>
</main><div class="modal" id="modal"><span class="close">&times;</span><div id="viewer"></div></div>
<script>
const items=[
{category:"Automotive",title:"Automotive Preview 01",file:"assets/BR_Autos 01.mp4",type:"video"},
{category:"Automotive",title:"Automotive Preview 02",file:"assets/BR_Autos 02.mp4",type:"video"},
{category:"Automotive",title:"Automotive Preview 03",file:"assets/BR_Autos 03.mp4",type:"video"},
{category:"Automotive",title:"Automotive Preview 04",file:"assets/BR_Autos 04.mp4",type:"video"},
{category:"Automotive",title:"Automotive Preview 05",file:"assets/BR_Autos 05.mp4",type:"video"},
{category:"Automotive",title:"Automotive Preview 06",file:"assets/BR_Autos 06.mp4",type:"video"},
{category:"Automotive",title:"Automotive Preview 07",file:"assets/BR_Autos 07.mp4",type:"video"},
{category:"Finance",title:"Finance Preview 01",file:"assets/BR_Finance 01.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 02",file:"assets/BR_Finance 02.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 03",file:"assets/BR_Finance 03.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 04",file:"assets/BR_Finance 04.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 05",file:"assets/BR_Finance 05.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 06",file:"assets/BR_Finance 06.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 07",file:"assets/BR_Finance 07.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 08",file:"assets/BR_Finance 08.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 10",file:"assets/BR_Finance 10.jpg",type:"image"}];
let active="All";const filters=document.querySelector("#filters"),grid=document.querySelector("#grid");
function render(){let cats=["All",...new Set(items.map(x=>x.category))];filters.innerHTML=cats.map(c=>`<button class="${c===active?"active":""}" onclick="active='${c}';render()">${c}</button>`).join("");grid.innerHTML=items.filter(x=>active==="All"||x.category===active).map((x,i)=>`<article class="card"><div class="phone-stage"><div class="phone"><div class="island"></div><div class="phone-screen"><div class="phone-status"><span>9:41</span><span>● ● ▰</span></div><div class="community-head"><div class="community-avatar">M</div><div><div class="community-name">Magfi Preview</div><div class="community-sub">Community preview</div></div></div><div class="phone-feed">${x.type==="video"?`<video controls muted playsinline preload="metadata" src="${x.file}"></video>`:`<img src="${x.file}" alt="${x.title}">`}</div></div><div class="scroll-hint">scroll ↕</div></div></div><div class="meta"><div class="cat">${x.category}</div><div class="title">${x.title}</div><div class="sub">Magfi Preview · ${x.type==="video"?"Video":"Image"}</div></div></article>`).join("")}
function show(file,type){const m=document.querySelector("#modal"),v=document.querySelector("#viewer");v.innerHTML=type==="video"?`<video controls autoplay src="${file}"></video>`:`<img src="${file}">`;m.classList.add("open")}
document.querySelector(".close").onclick=()=>document.querySelector("#modal").classList.remove("open");document.querySelector("#modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("open")};render();
</script></body></html>
