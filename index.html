<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snypse Gallery</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:Inter,Arial,sans-serif}main{max-width:1280px;margin:auto;padding:32px 24px 70px}.brand{font-weight:900;font-size:28px;letter-spacing:2px;padding-bottom:32px;border-bottom:1px solid #292929}.brand b{color:#ef233c}.hero{padding:58px 0 45px}.hero h1{font-size:clamp(44px,7vw,82px);line-height:.94;margin:0 0 28px;letter-spacing:-4px;max-width:760px}.hero p{color:#999;font-size:20px;line-height:1.55;max-width:690px}.filters{display:flex;gap:10px;overflow:auto;padding:10px 0 30px}.filters button{white-space:nowrap;border:1px solid #333;background:#111;color:#bbb;border-radius:99px;padding:12px 20px;font-size:15px}.filters button.active{background:#f5f5f5;color:#111}.grid{columns:4 230px;column-gap:18px}.card{break-inside:avoid;margin:0 0 18px;border:1px solid #292929;border-radius:18px;overflow:hidden;background:#141414;cursor:pointer}.media{background:#1b1b1b;aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;color:#666;overflow:hidden}.media img,.media video{width:100%;height:100%;object-fit:cover}.meta{padding:18px}.cat{color:#ef233c;text-transform:uppercase;font-weight:800;font-size:12px;letter-spacing:2px}.title{font-weight:800;font-size:19px;margin:10px 0 6px}.sub{color:#888;font-size:14px}.notice{border:1px dashed #444;border-radius:14px;padding:16px;color:#999;margin-bottom:25px}.modal{display:none;position:fixed;inset:0;background:#000e;z-index:10;align-items:center;justify-content:center;padding:25px}.modal.open{display:flex}.modal img,.modal video{max-height:90vh;max-width:90vw;border-radius:14px}.close{position:absolute;right:25px;top:20px;font-size:36px;cursor:pointer}@media(max-width:600px){main{padding:25px 22px}.hero{padding:45px 0 30px}.hero h1{letter-spacing:-2px}.grid{columns:2 140px;column-gap:14px}.meta{padding:14px}.title{font-size:16px}}

.phone-stage{padding:18px 12px 20px;display:flex;justify-content:center;background:#101010}
.phone{width:min(100%,270px);aspect-ratio:9/19.5;background:#050505;border:2px solid #3b3b3b;border-radius:38px;padding:7px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #111}
.phone-screen{height:100%;border-radius:30px;overflow:hidden;background:#161616;display:flex;flex-direction:column}
.phone-status{height:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-size:9px;font-weight:700;color:#eee;background:#111}
.island{width:64px;height:17px;border-radius:20px;background:#000;position:absolute;top:11px;left:50%;transform:translateX(-50%);z-index:2}
.community-head{height:52px;flex:0 0 52px;border-top:1px solid #222;border-bottom:1px solid #292929;display:flex;align-items:center;gap:10px;padding:0 13px;background:#171717}
.community-avatar{width:32px;height:32px;border-radius:50%;background:#ef233c;display:grid;place-items:center;color:white;font-size:11px;font-weight:900}
.community-name{font-size:13px;font-weight:800}.community-sub{font-size:9px;color:#888;margin-top:2px}
.phone-feed{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:#0e0e0e;scrollbar-width:thin}
.phone-feed img,.phone-feed video{display:block;width:100%;height:auto;object-fit:contain;background:#0e0e0e}
.phone-feed video{min-height:100%}
.scroll-hint{position:absolute;right:12px;bottom:16px;background:#000b;border:1px solid #444;color:#ddd;border-radius:99px;padding:5px 8px;font-size:8px;pointer-events:none}
.card .media{display:none}
.modal .phone{width:min(390px,85vw)}
@media(max-width:600px){.phone-stage{padding:12px 7px 15px}.phone{width:min(100%,210px);border-radius:31px}.phone-screen{border-radius:24px}}
</style>
</head>
<body><main>
<div class="brand">SNYPSE<b>.</b></div>
<section class="hero"><h1>Creative work,<br>in context.</h1><p>A curated showcase of branded experiences across high-affinity digital communities. Explore examples by industry.</p></section>
<div class="filters" id="filters"></div><div class="grid" id="grid"></div>
</main><div class="modal" id="modal"><span class="close">&times;</span><div id="viewer"></div></div>
<script>
const items=[
{category:"Automotive",title:"Automotive Preview 01",file:"assets/BR_Autos 01.mp4",type:"video"},
{category:"Automotive",title:"Automotive Preview 02",file:"assets/BR_Autos 02.mp4",type:"video"},
{category:"Automotive",title:"Automotive Preview 03",file:"assets/BR_Autos 03.mp4",type:"video"},
{category:"Automotive",title:"Automotive Preview 04",file:"assets/BR_Autos 04.mp4",type:"video"},
{category:"Automotive",title:"Automotive Preview 05",file:"assets/BR_Autos 05.mp4",type:"video"},
{category:"Automotive",title:"Automotive Preview 06",file:"assets/BR_Autos 06.mp4",type:"video"},
{category:"Automotive",title:"Automotive Preview 07",file:"assets/BR_Autos 07.mp4",type:"video"},
{category:"Finance",title:"Finance Preview 01",file:"assets/BR_Finance 01.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 02",file:"assets/BR_Finance 02.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 03",file:"assets/BR_Finance 03.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 04",file:"assets/BR_Finance 04.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 05",file:"assets/BR_Finance 05.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 06",file:"assets/BR_Finance 06.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 07",file:"assets/BR_Finance 07.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 08",file:"assets/BR_Finance 08.jpg",type:"image"},
{category:"Finance",title:"Finance Preview 10",file:"assets/BR_Finance 10.jpg",type:"image"}];
let active="All";const filters=document.querySelector("#filters"),grid=document.querySelector("#grid");
function render(){let cats=["All",...new Set(items.map(x=>x.category))];filters.innerHTML=cats.map(c=>`<button class="${c===active?"active":""}" onclick="active='${c}';render()">${c}</button>`).join("");grid.innerHTML=items.filter(x=>active==="All"||x.category===active).map((x,i)=>`<article class="card"><div class="phone-stage"><div class="phone"><div class="island"></div><div class="phone-screen"><div class="phone-status"><span>9:41</span><span>● ● ▰</span></div><div class="community-head"><div class="community-avatar">M</div><div><div class="community-name">Magfi Preview</div><div class="community-sub">Community preview</div></div></div><div class="phone-feed">${x.type==="video"?`<video controls muted playsinline preload="metadata" src="${x.file}"></video>`:`<img src="${x.file}" alt="${x.title}">`}</div></div><div class="scroll-hint">scroll ↕</div></div></div><div class="meta"><div class="cat">${x.category}</div><div class="title">${x.title}</div><div class="sub">Magfi Preview · ${x.type==="video"?"Video":"Image"}</div></div></article>`).join("")}
function show(file,type){const m=document.querySelector("#modal"),v=document.querySelector("#viewer");v.innerHTML=type==="video"?`<video controls autoplay src="${file}"></video>`:`<img src="${file}">`;m.classList.add("open")}
document.querySelector(".close").onclick=()=>document.querySelector("#modal").classList.remove("open");document.querySelector("#modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("open")};render();
</script></body></html>
