<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snypse Gallery</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:Inter,Arial,sans-serif}main{max-width:1280px;margin:auto;padding:32px 24px 70px}.brand{font-weight:900;font-size:28px;letter-spacing:2px;padding-bottom:32px;border-bottom:1px solid #292929}.brand b{color:#ef233c}.hero{padding:58px 0 45px}.hero h1{font-size:clamp(44px,7vw,82px);line-height:.94;margin:0 0 28px;letter-spacing:-4px;max-width:760px}.hero p{color:#999;font-size:20px;line-height:1.55;max-width:690px}.filters{display:flex;gap:10px;overflow:auto;padding:10px 0 30px}.filters button{white-space:nowrap;border:1px solid #333;background:#111;color:#bbb;border-radius:99px;padding:12px 20px;font-size:15px}.filters button.active{background:#f5f5f5;color:#111}.grid{columns:4 230px;column-gap:18px}.card{break-inside:avoid;margin:0 0 18px;border:1px solid #292929;border-radius:18px;overflow:hidden;background:#141414;cursor:pointer}.media{background:#1b1b1b;aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;color:#666;overflow:hidden}.media img,.media video{width:100%;height:100%;object-fit:cover}.meta{padding:18px}.cat{color:#ef233c;text-transform:uppercase;font-weight:800;font-size:12px;letter-spacing:2px}.title{font-weight:800;font-size:19px;margin:10px 0 6px}.sub{color:#888;font-size:14px}.notice{border:1px dashed #444;border-radius:14px;padding:16px;color:#999;margin-bottom:25px}.modal{display:none;position:fixed;inset:0;background:#000e;z-index:10;align-items:center;justify-content:center;padding:25px}.modal.open{display:flex}.modal img,.modal video{max-height:90vh;max-width:90vw;border-radius:14px}.close{position:absolute;right:25px;top:20px;font-size:36px;cursor:pointer}@media(max-width:600px){main{padding:25px 22px}.hero{padding:45px 0 30px}.hero h1{letter-spacing:-2px}.grid{columns:2 140px;column-gap:14px}.meta{padding:14px}.title{font-size:16px}}
</style>
</head>
<body><main>
<div class="brand">SNYPSE<b>.</b></div>
<section class="hero"><h1>Creative work,<br>in context.</h1><p>A curated showcase of branded experiences across high-affinity digital communities. Explore examples by industry.</p></section>
<div class="notice">Gallery structure is live. Creative assets are being added to the repository.</div>
<div class="filters" id="filters"></div><div class="grid" id="grid"></div>
</main><div class="modal" id="modal"><span class="close">&times;</span><div id="viewer"></div></div>
<script>
const items=[
{category:"Automotive",title:"Automotive Preview 13",file:"assets/br-autos-13.png",type:"image"},
{category:"Automotive",title:"Automotive Video Preview",file:"assets/br-autos-07.mp4",type:"video"},
{category:"Finance",title:"Finance Preview 10",file:"assets/br-finance-10.png",type:"image"},
{category:"Entertainment",title:"Entertainment Preview 06",file:"assets/br-entertainment-06.png",type:"image"},
{category:"Beauty",title:"Beauty Preview 01",file:"assets/beauty-01.png",type:"image"},
{category:"Travel",title:"Travel Preview 01",file:"assets/travel-01.png",type:"image"}];
let active="All";const filters=document.querySelector("#filters"),grid=document.querySelector("#grid");
function render(){let cats=["All",...new Set(items.map(x=>x.category))];filters.innerHTML=cats.map(c=>`<button class="${c===active?"active":""}" onclick="active='${c}';render()">${c}</button>`).join("");grid.innerHTML=items.filter(x=>active==="All"||x.category===active).map((x,i)=>`<article class="card" onclick="show('${x.file}','${x.type}')"><div class="media">${x.type==="video"?`<video muted playsinline src="${x.file}"></video>`:`<img src="${x.file}" alt="${x.title}" onerror="this.style.display='none';this.parentElement.innerHTML='Creative pending upload'">`}</div><div class="meta"><div class="cat">${x.category}</div><div class="title">${x.title}</div><div class="sub">Telegram community preview · ${x.type==="video"?"Video":"Image"}</div></div></article>`).join("")}
function show(file,type){const m=document.querySelector("#modal"),v=document.querySelector("#viewer");v.innerHTML=type==="video"?`<video controls autoplay src="${file}"></video>`:`<img src="${file}">`;m.classList.add("open")}
document.querySelector(".close").onclick=()=>document.querySelector("#modal").classList.remove("open");document.querySelector("#modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("open")};render();
</script></body></html>
