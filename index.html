let active="All",market="All";const categorySelect=document.querySelector("#categorySelect"),marketSelect=document.querySelector("#marketSelect"),grid=document.querySelector("#grid");
function initFilters(){const cats=["All",...new Set(items.map(x=>x.category))];marketSelect.innerHTML=["All","Brazil","Europe"].map(m=>`<option value="${m}">${m==="All"?"All markets":m}</option>`).join("");categorySelect.innerHTML=cats.map(cat=>`<option value="${cat}">${cat==="All"?"All categories":cat}</option>`).join("");marketSelect.onchange=()=>{market=marketSelect.value;render()};categorySelect.onchange=()=>{active=categorySelect.value;render()}}
function render(){grid.innerHTML=items.filter(x=>(active==="All"||x.category===active)&&(market==="All"||x.market===market)).map((x,i)=>`<article class="card"><div class="phone-stage"><div class="phone"><div class="island"></div><div class="phone-screen"><div class="phone-status"><span>9:41</span><span>● ● ▰</span></div><div class="community-head"><div class="community-avatar">M</div><div><div class="community-name">Magfi Preview</div><div class="community-sub">Community preview</div></div></div><div class="phone-feed">${x.type==="video"?`<video autoplay loop muted playsinline preload="metadata" src="${x.file}"></video>`:`<img loading="lazy" src="${x.file}" alt="${x.title}">`}</div></div><div class="scroll-hint">scroll ↕</div></div></div><div class="meta"><div class="cat">${x.category}</div><div class="title">${x.title}</div><div class="sub">Magfi Preview · ${x.type==="video"?"Video":"Image"}</div></div></article>`).join("")}
function show(file,type){const m=document.querySelector("#modal"),v=document.querySelector("#viewer");v.innerHTML=type==="video"?`<video autoplay loop muted playsinline controls src="${file}"></video>`:`<img src="${file}">`;m.classList.add("open")}
document.querySelector(".close").onclick=()=>document.querySelector("#modal").classList.remove("open");document.querySelector("#modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("open")};initFilters();render();
