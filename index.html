0 5px}.sub{color:#777277;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#000e;z-index:10;align-items:center;justify-content:center;padding:25px}.modal.open{display:flex}.modal img,.modal video{max-height:90vh;max-width:90vw;border-radius:14px}.close{position:absolute;right:25px;top:20px;font-size:36px;cursor:pointer}
